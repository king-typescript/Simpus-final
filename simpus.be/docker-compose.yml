services:
  postgres:
    image: postgres:16-alpine
    container_name: simpus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-simpus_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-simpus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - simpus_network

  rustfs:
    image: adobe/s3mock:latest
    container_name: simpus_rustfs
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9191:9191"
    environment:
      - initialBuckets=bookcovers
    networks:
      - simpus_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simpus_app
    command: ["./node_modules/.bin/next", "start"]
    restart: unless-stopped
    volumes:
      - ./prisma:/app/prisma:ro
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - uploads_data:/app/public/uploads
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-simpus_db}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET harus diatur di file .env dan minimal 32 karakter}
      CRON_SECRET: ${CRON_SECRET:-}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RUN_MIGRATION: ${RUN_MIGRATION:-true}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9090}
      RUSTFS_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9090}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-bookcovers}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadminsecret12345}
      RUSTFS_PRESIGNED_URL_TTL: ${RUSTFS_PRESIGNED_URL_TTL:-900}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - simpus_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  rustfs_data:
    driver: local

networks:
  simpus_network:
    driver: bridge
