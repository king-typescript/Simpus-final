services:
  postgres:
    image: postgres:16-alpine
    container_name: simpus_postgres
    restart: unless-stopped
    # Port 5432 sengaja tidak di-expose ke publik demi keamanan.
    # Komunikasi database hanya dilakukan melalui jaringan internal Docker (simpus_network).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-simpus_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-simpus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - simpus_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simpus_app
    restart: unless-stopped
    # Hanya bind ke localhost (127.0.0.1) agar port 3000 tidak bisa diakses langsung dari publik tanpa melalui Nginx
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-simpus_db}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET harus diatur di file .env dan minimal 32 karakter}
      CRON_SECRET: ${CRON_SECRET:-}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RUN_MIGRATION: ${RUN_MIGRATION:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simpus_network

volumes:
  postgres_data:
    driver: local

networks:
  simpus_network:
    driver: bridge
